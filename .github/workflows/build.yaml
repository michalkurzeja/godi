name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-analysis:
    name: Static analysis

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          skip-cache: true

  tests:
    name: Tests

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  viewer:
    name: Viewer regressions

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The self-check: the runner image ships both, and the day it stops this
      # line says so instead of the suite quietly skipping.
      - name: Show what CI will drive
        run: google-chrome --version && node --version

      - name: Viewer regressions
        env:
          GODI_REQUIRE_VIEWER_TESTS: "1"
        run: go test ./graph/html/... -run TestViewerRegressions -count=1 -v
