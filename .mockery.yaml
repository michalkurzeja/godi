log-level: "warn"
template: "testify"

all: true
recursive: true

# One mocks package per package that declares an interface, and one file in it.
# A package here never has enough interfaces to be worth splitting, and a single
# file makes the generated tree easy to delete and regenerate wholesale.
dir: "{{.InterfaceDir}}/mocks"
pkgname: "mocks"
filename: "mocks.go"
# Keep the interface's own name: the package it lands in already says it is a
# mock.
structname: "{{.InterfaceName}}"

# The examples are wiring to read, not seams to mock.
exclude-subpkg-regex:
  - "examples"

packages:
  github.com/michalkurzeja/godi/v2:
